[package]
name = "annota"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Screenshot, annotation and screen recording for GNOME"
repository = "https://github.com/trosinde/Annota"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
# `gtk4` (gdk4-wayland, gdk4-x11; MIT): the parent window handle for the portal's first-use access
# dialog (add-screen-capture, "Portal permission handling").
# `desktop::screencast` (window stills, ADR 0002) is not behind a feature in 0.11.1.
ashpd = { version = "0.11.1", default-features = false, features = ["async-std", "gtk4"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
futures-channel = "0.3"
# Document model (add-annotation-editor). Versions chosen for MSRV 1.85, see that change's design.md.
# `pdf` + `v1_16` (PDF metadata, cairo >= 1.16): PDF export, add-export-share.
cairo-rs = { version = "0.20", features = ["png", "pdf", "v1_16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# zip >= 9.0.5 fixes GHSA-m665-v7pm-7grj, -q7v9-x93c-xqv3, -8hxf-qr8p-62x4, -9hj8-73fh-9963 and
# needs Rust >= 1.88; the reason the MSRV is 1.91 (ADR 0003). Only Deflate/Stored: no AES, no
# legacy decoders, no other codecs.
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }
# zip's `deflate-flate2` names no flate2 backend; pick the pure-Rust one (no zlib build-dep).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rstar = "0.13"
# Text layout in the shared renderer (add-core-annotation-tools: text, callout, step labels).
# Same gtk-rs 0.20 generation as cairo-rs; libpango is already linked through GTK.
pango = "0.20"
pangocairo = "0.20"
# Export encoders (add-export-share, see its design.md). Statically built into the binary, so no
# optional system codec (gdk-pixbuf loader) can be missing at runtime. jpeg-encoder 0.7 needs
# Rust 1.87; 0.6 is the last for MSRV 1.85. libwebp-sys compiles its bundled libwebp with `cc`.
jpeg-encoder = "0.6"
libwebp-sys = { version = "0.14", default-features = false, features = ["std"] }
# One frame of a ScreenCast window stream (fix-window-capture-screencast, ADR 0002). 0.23 is the
# gtk-rs 0.20 generation, so GStreamer shares glib 0.20 with gtk4/libadwaita (0.24 would pull in a
# second glib, 0.21). No feature flags: nothing above GStreamer 1.14's API is used, and Ubuntu
# 24.04 ships 1.24. Dynamically linked LGPL GStreamer.
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
# Discoverer for the Export Recording window's poster frame and duration (add-screen-recording).
gstreamer-pbutils = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
# Decodes exported JPEGs in the export round-trip tests (WebP is decoded with libwebp itself).
jpeg-decoder = { version = "0.3", default-features = false }
