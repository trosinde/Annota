[package]
name = "annota"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Screenshot, annotation and screen recording for GNOME"
repository = "https://github.com/trosinde/Annota"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
futures-channel = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
