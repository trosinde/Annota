name: Annota build dependencies
description: >
  Installs the Build-Depends of debian/control on an Ubuntu 24.04 runner, puts the pinned
  Rust 1.91 toolchain first on PATH (CLAUDE.md §2) and writes the versions that decide whether
  the build and the golden-image tests behave as on a developer machine into the log.

runs:
  using: composite
  steps:
    # The runner's apt mirror is sometimes so slow (about 100 kB/s, measured 2026-11-24 on
    # us-east-2.ec2.archive.ubuntu.com) that downloading the ~280 MB below took 30–45 minutes and
    # the jobs hit their timeouts. Two remedies, neither changes what gets installed:
    # - the downloaded .debs are cached (key: runner image, this file, ISO week), so a warm run
    #   downloads only what changed in the archive since;
    # - the mirrors are ranked by a short throughput probe before `apt-get update`, with the
    #   others kept as fallbacks, and apt retries and times out stalled connections.
    - name: Apt cache key
      id: apt-key
      shell: bash
      run: |
        hash=$(sha256sum "$GITHUB_ACTION_PATH/action.yml" | cut -c1-16)
        prefix="apt-debs-${ImageOS:-unknown}-$hash"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix-$(date -u +%G-W%V)-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/apt-debs" >> "$GITHUB_OUTPUT"

    - name: Restore cached .debs
      id: apt-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: |
          ${{ steps.apt-key.outputs.prefix }}-

    - name: Install build dependencies
      shell: bash
      env:
        APT_DEBS: ${{ steps.apt-key.outputs.dir }}
      run: |
        "$GITHUB_ACTION_PATH/apt-install.sh" \
          build-essential debhelper meson ninja-build pkgconf cargo-1.91 rustc-1.91 \
          rustfmt-1.91 rust-1.91-clippy \
          libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          blueprint-compiler gettext \
          desktop-file-utils appstream libglib2.0-bin lintian devscripts \
          fonts-dejavu-core fontconfig

    # Saved here, not in a post step, so a later failing step (tests, lintian) still leaves a
    # warm cache behind. Parallel jobs race for the same key; the losers only log a warning.
    - name: Save cached .debs
      if: steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}

    # Same as `export PATH=/usr/lib/rust-1.91/bin:$PATH` in CLAUDE.md, for every later step.
    - name: Use Rust 1.91
      shell: bash
      run: echo /usr/lib/rust-1.91/bin >> "$GITHUB_PATH"

    # The golden images render text in DejaVu Sans and in Annota's default family, Adwaita Sans
    # (`DEFAULT_FAMILY`, src/tools/text.rs). Without Adwaita Sans, fontconfig falls back to
    # another font, the text gets other bounds, and `callout_objects` and
    # `annota_theme_quick_styles` fail — CI was red from 2026-11-01 to 2026-11-14 for exactly
    # that. Ubuntu 24.04 has no `fonts-adwaita-sans`, so this installs the Ubuntu 26.04 package
    # the goldens were made with, checksum-pinned. Measured 2026-11-14 in ubuntu:24.04 and
    # ubuntu:26.04 containers: render tests 22/24 without it, 24/24 with it, on Pango 1.52 and
    # 1.57 alike. To update: take the version `apt-cache show fonts-adwaita-sans` lists on the
    # machine that regenerates the goldens.
    - name: Install Adwaita Sans
      shell: bash
      run: |
        deb=fonts-adwaita-sans_49.0+dfsg-2_all.deb
        curl -fsSL -o "$RUNNER_TEMP/$deb" "https://launchpad.net/ubuntu/+archive/primary/+files/$deb"
        echo "69439ea5a600a1b6dd8f17e1a45951e7c100b5acb2df7af849a04558c45acb93  $RUNNER_TEMP/$deb" | sha256sum -c -
        sudo dpkg -i "$RUNNER_TEMP/$deb"

    # The runner image ships fonts-dejavu-extra; a desktop with fonts-dejavu-core does not, and
    # that is where the goldens are made. With DejaVuSans-Oblique present, the italic note in
    # `text_objects` gets the real oblique face instead of a synthesised slant and 111 of 4950
    # cells differ — measured 2026-11-14, the same count in a ubuntu:24.04 container with the
    # package as on the runner, and 0 without it.
    - name: Remove fonts the goldens were not made with
      shell: bash
      run: |
        if dpkg -s fonts-dejavu-extra >/dev/null 2>&1; then
          # dpkg, not apt-get: apt would also remove whatever depends on it.
          sudo dpkg --remove --force-depends fonts-dejavu-extra
        fi

    - name: Toolchain and renderer versions
      shell: bash
      run: |
        rustc -V && cargo -V
        echo "pango $(pkg-config --modversion pango), cairo $(pkg-config --modversion cairo)," \
          "freetype $(pkg-config --modversion freetype2), harfbuzz $(pkg-config --modversion harfbuzz)," \
          "gtk4 $(pkg-config --modversion gtk4), libadwaita $(pkg-config --modversion libadwaita-1)"
        for f in "Adwaita Sans" "DejaVu Sans" "DejaVu Sans:bold" "DejaVu Sans:italic"; do
          echo "$f -> $(fc-match "$f")"
        done
        echo "$(fc-list | wc -l) fonts installed"
