name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper meson ninja-build pkgconf cargo-1.85 rustc-1.85 \
            libgtk-4-dev libadwaita-1-dev blueprint-compiler gettext \
            desktop-file-utils appstream libglib2.0-bin lintian devscripts \
            nodejs npm
          rustup component add rustfmt clippy

      - name: Configure (generates src/config.rs)
        run: PATH=/usr/lib/rust-1.85/bin:$PATH meson setup _build -Dprofile=development

      - name: Format
        run: PATH=/usr/lib/rust-1.85/bin:$PATH cargo fmt --check

      - name: Clippy
        run: PATH=/usr/lib/rust-1.85/bin:$PATH cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: PATH=/usr/lib/rust-1.85/bin:$PATH meson test -C _build --print-errorlogs

      - name: OpenSpec validation
        run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict

      - name: Build .deb
        run: |
          rm -rf _build
          build-aux/make-deb.sh
          mkdir -p dist && cp ../annota_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: annota-deb-ubuntu-24.04
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb

  publish-apt-repo:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install apt-ftparchive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: annota-deb-ubuntu-24.04
          path: dist

      - name: Import release signing key
        run: |
          echo "${{ secrets.ANNOTA_RELEASE_SIGNING_KEY }}" | base64 -d | gpg --batch --import
          echo "ANNOTA_SIGNING_KEYID=$(gpg --with-colons --list-secret-keys | awk -F: '/^sec/ {print $5; exit}')" >> "$GITHUB_ENV"

      - name: Assemble signed APT repo
        run: build-aux/make-apt-repo.sh dist/annota_*.deb docs/apt "$ANNOTA_SIGNING_KEYID"

      - name: Publish keyring alongside the repo
        run: cp packaging/annota-archive-keyring.asc docs/annota-archive-keyring.asc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
