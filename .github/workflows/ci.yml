name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything runs on Ubuntu 24.04 with the distro's Rust 1.91 (noble-updates): the oldest
# platform and the MSRV Annota is packaged for (CLAUDE.md §2, ADR 0003), so no separate MSRV job
# is needed.
jobs:
  scenario-gate:
    name: scenario gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Gate script tests
        run: python3 -m unittest tools/tests/test_scenario_gate.py

      # Every test tagged with its scenario, every implemented scenario covered (CLAUDE.md §5).
      - name: Scenario gate
        run: |
          python3 tools/scenario_gate.py check --format markdown >> "$GITHUB_STEP_SUMMARY" || true
          python3 tools/scenario_gate.py check

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-deps
      - uses: Swatinem/rust-cache@v2

      - name: Configure (generates src/config.rs)
        run: meson setup _build -Dprofile=development

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-deps
      - uses: Swatinem/rust-cache@v2
        with:
          # meson test builds into _build/target (src/meson.build passes --target-dir).
          workspaces: ". -> _build/target"

      - name: Configure
        run: meson setup _build -Dprofile=development

      # `--verbose` streams each test's own output instead of capturing it. Without it a failing
      # cargo-test run says only "exit status 101": the run of 2026-11-14 could not be diagnosed
      # from its log at all, and the three before it had been red since 2026-11-01 unnoticed.
      - name: Tests
        run: meson test -C _build --print-errorlogs --verbose

      - name: Test log
        if: failure()
        run: cat _build/meson-logs/testlog.txt

  openspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: OpenSpec validation
        run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict

  deb:
    name: .deb (lintian)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-deps

      - name: Build .deb
        run: |
          build-aux/make-deb.sh
          mkdir -p dist && cp ../annota_*.deb dist/

      - uses: actions/upload-artifact@v7
        with:
          name: annota-deb-ubuntu-24.04
          path: dist/*.deb
          if-no-files-found: error
