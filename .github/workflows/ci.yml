name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper meson ninja-build pkgconf cargo-1.85 rustc-1.85 \
            libgtk-4-dev libadwaita-1-dev blueprint-compiler gettext \
            desktop-file-utils appstream libglib2.0-bin lintian devscripts \
            nodejs npm
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --check

      - name: Configure (generates src/config.rs)
        run: PATH=/usr/lib/rust-1.85/bin:$PATH meson setup _build -Dprofile=development

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: PATH=/usr/lib/rust-1.85/bin:$PATH meson test -C _build --print-errorlogs

      - name: OpenSpec validation
        run: npx --yes @fission-ai/openspec@1.15.0 validate --all --strict

      - name: Build .deb
        run: |
          rm -rf _build
          build-aux/make-deb.sh
          mkdir -p dist && cp ../annota_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: annota-deb-ubuntu-24.04
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
