<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport-size" content="1280x800">
<title>Annota — smart move low detail</title>
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/adwaita.css">
<style>
  .tool-strip { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; background: var(--window-bg); box-shadow: inset -1px 0 var(--separator); position: relative; z-index: 5; }
  .tool-strip .btn { width: 36px; min-height: 34px; padding: 0; }
  .tool-strip .separator-h { width: 28px; margin: 4px 0; }
  .props { display: flex; flex-direction: column; }
  .props .scroll { padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; }
  .props .side-head { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .props .side-head .heading { font-weight: var(--fw-bold); flex: 1; }
  .props .foot { margin-top: auto; padding: 12px; display: flex; gap: 6px; box-shadow: inset 0 1px var(--separator); }
  .props .foot .btn { flex: 1; }
  .lbl { font-size: var(--fs-small); }
  .field-label { font-size: var(--fs-small); font-weight: var(--fw-bold); opacity: var(--dim-opacity); padding: 0 2px; }
  .row-stack { display: flex; flex-direction: column; gap: 6px; }
  .full { width: 100%; }
  .toggle-group.full { display: flex; }
  .toggle-group.full > .toggle { flex: 1; justify-content: center; padding: 0 4px; font-size: var(--fs-small); white-space: nowrap; }
  .toggle-group.full.four > .toggle { font-size: var(--fs-caption); padding: 0 2px; }
  .canvas-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  svg.annotations text { font-family: var(--font-ui); }
  .ants { fill: none; stroke: #ffffff; stroke-width: 1; }
  .ants2 { fill: none; stroke: #1f1f24; stroke-width: 1; stroke-dasharray: 4 4; }
  .hint { font-size: var(--fs-caption); opacity: var(--dim-opacity); padding: 0 2px; line-height: 1.4; }
  .scale .trough { flex: 1; }
  .scale .lbl { width: 84px; flex: none; }

  .det { fill: none; stroke: var(--annota-azure); stroke-width: 2; stroke-dasharray: 6 4; }
  .det.text { stroke: var(--annota-violet); }
  .det.hover { stroke-dasharray: none; stroke-width: 3; fill: rgb(47 128 237 / 10%); }
  .legend { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-small); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { width: 18px; height: 12px; border-radius: 2px; border: 2px dashed var(--annota-azure); }
  .legend i.t { border-color: var(--annota-violet); }
  .pal { display: flex; flex-direction: column; gap: 6px; }
  .pal .row { min-height: 50px; }
  .pal-dots { display: inline-flex; gap: 3px; }
  .pal-dots b { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 6 / 15%); }
  .ba-label { position: absolute; top: 10px; z-index: 3; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--osd-bg); color: #fff; }
  .split-canvas { display: flex; gap: 18px; align-items: center; }
  .split-canvas .canvas-image { position: relative; }
  .busy { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; }
  .busy .osd-toolbar { gap: 10px; padding: 10px 16px; }
  .drag-ghost { filter: drop-shadow(0 6px 10px rgb(0 0 6 / 35%)); }
</style>
</head>
<body class="mock-frame flush">
<div class="window" style="width:1280px;height:800px">

  <div class="headerbar">
    <div class="start">
      <button class="btn image-button" title="New Capture"><svg class="icon"><use href="#i-capture-region"/></svg></button>
      <div class="linked">
        <button class="btn image-button" title="Undo (Ctrl+Z)"><svg class="icon"><use href="#i-undo"/></svg></button>
        <button class="btn image-button" title="Redo (Ctrl+Shift+Z)" disabled><svg class="icon"><use href="#i-redo"/></svg></button>
      </div>
    </div>
    <div class="title-widget"><span class="title">Harbor preferences</span><span class="subtitle">1600 × 1000</span></div>
    <div class="end">
      <button class="btn image-button" title="Copy (Ctrl+C)"><svg class="icon"><use href="#i-copy"/></svg></button>
      <button class="btn text-button suggested-action" title="Export (Ctrl+E)">Export</button>
      <button class="btn flat image-button" title="Main Menu"><svg class="icon"><use href="#i-open-menu"/></svg></button>
      <div class="window-controls"><span class="wc"><svg class="icon"><use href="#i-close"/></svg></span></div>
    </div>
  </div>
  <div class="split-view">
    <div class="tool-strip">
<button class="btn flat active" title="Select (V)"><svg class="icon"><use href="#i-select"/></svg></button>
<button class="btn flat" title="Selection (Q)"><svg class="icon"><use href="#i-selection"/></svg></button>
<button class="btn flat" title="Magic Wand (W)"><svg class="icon"><use href="#i-magic-wand"/></svg></button>
<span class="separator-h"></span>
<button class="btn flat" title="Arrow (A)"><svg class="icon"><use href="#i-arrow"/></svg></button>
<button class="btn flat" title="Line (L)"><svg class="icon"><use href="#i-line"/></svg></button>
<button class="btn flat" title="Pen (P)"><svg class="icon"><use href="#i-pen"/></svg></button>
<button class="btn flat" title="Shape (U)"><svg class="icon"><use href="#i-shape"/></svg></button>
<button class="btn flat" title="Text (T)"><svg class="icon"><use href="#i-text"/></svg></button>
<button class="btn flat" title="Callout (K)"><svg class="icon"><use href="#i-callout"/></svg></button>
<button class="btn flat" title="Step (S)"><svg class="icon"><use href="#i-step"/></svg></button>
<button class="btn flat" title="Highlighter (H)"><svg class="icon"><use href="#i-highlighter"/></svg></button>
<span class="separator-h"></span>
<button class="btn flat" title="Redact (B)"><svg class="icon"><use href="#i-redact"/></svg></button>
<button class="btn flat" title="Magnify (M)"><svg class="icon"><use href="#i-magnify"/></svg></button>
<button class="btn flat" title="Spotlight (G)"><svg class="icon"><use href="#i-spotlight"/></svg></button>
<button class="btn flat" title="Stamp (I)"><svg class="icon"><use href="#i-stamp"/></svg></button>
<span class="separator-h"></span>
<button class="btn flat" title="Crop (C)"><svg class="icon"><use href="#i-crop"/></svg></button>
<button class="btn flat" title="Cut-Out (X)"><svg class="icon"><use href="#i-cut-out"/></svg></button>
<button class="btn flat" title="Fill (F)"><svg class="icon"><use href="#i-fill"/></svg></button>
<button class="btn flat" title="Eraser (E)"><svg class="icon"><use href="#i-eraser"/></svg></button>

</div>
    <div class="content-pane" style="position:relative">
      <div class="canvas-area">
        <div class="canvas-image" style="width:800px;height:500px;">
          <img src="../../kit/sample-content/png/a-harbor-backup.png" alt="">
          
          <svg class="annotations" viewBox="0 0 800 500"><rect class="det" x="316.5" y="114.0" width="296.5" height="96.0" rx="3" vector-effect="non-scaling-stroke"/><rect class="det" x="316.5" y="229.5" width="296.5" height="92.0" rx="3" vector-effect="non-scaling-stroke"/><rect class="det" x="316.5" y="341.0" width="296.5" height="50.5" rx="3" vector-effect="non-scaling-stroke"/><rect class="det" x="122.0" y="57.0" width="135.5" height="386.0" rx="3" vector-effect="non-scaling-stroke"/><rect class="det" x="487.0" y="392.0" width="128.5" height="31.0" rx="3" vector-effect="non-scaling-stroke"/><rect class="det" x="317.0" y="87.0" width="206.0" height="28.5" rx="3" vector-effect="non-scaling-stroke"/><rect class="det" x="317.0" y="213.0" width="46.0" height="17.5" rx="3" vector-effect="non-scaling-stroke"/><rect class="det" x="317.0" y="324.5" width="76.0" height="18.5" rx="3" vector-effect="non-scaling-stroke"/></svg>
        </div>
        <div class="osd-toolbar" style="position:absolute;right:18px;bottom:18px;z-index:4">
          <button class="btn image-button"><svg class="icon"><use href="#i-zoom-out"/></svg></button>
          <span class="label">50 %</span>
          <button class="btn image-button"><svg class="icon"><use href="#i-zoom-in"/></svg></button>
        </div>
      </div>
      
    </div>
    <div class="sidebar-pane end props">
      <div class="scroll">
<div class="side-head"><svg class="icon"><use href="#i-select"/></svg><span class="heading">Smart Move</span><span class="switch on"></span></div>
<div class="preferences-group">
  <div class="group-header"><div class="text"><span class="heading">Detail</span><span class="description">How finely the image is split into objects</span></div></div>
  <div class="scale"><span class="lbl">Detail</span><div class="trough"><div class="fill" style="width:15%"></div><div class="knob" style="left:15%"></div><span class="mark" style="left:0%"></span><span class="mark" style="left:50%"></span><span class="mark" style="left:100%"></span></div><span class="value">15</span></div><div class="hbox" style="justify-content:space-between;padding:0 2px 0 96px"><span class="caption dim-label">Large blocks</span><span class="caption dim-label">Single controls</span></div>
</div>
<div class="boxed-list"><div class="row "><div class="text"><span class="title">Found</span><span class="subtitle">9 elements · 0 text blocks</span></div><div class="suffix"></div></div></div>
<div class="legend"><span><i></i>UI element</span><span><i class="t"></i>Text block</span></div>

<div class="hint">Drag an element to move it. Its old place is filled from the surrounding background. <kbd class="key">Delete</kbd> removes it.</div>
      </div>
      
    </div>
  </div>
</div>
<script src="../../kit/icons.js"></script>
</body>
</html>
