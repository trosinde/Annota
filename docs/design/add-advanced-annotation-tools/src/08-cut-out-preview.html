<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport-size" content="1280x800">
<title>Annota — cut-out preview</title>
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/adwaita.css">
<style>
  .tool-strip { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; background: var(--window-bg); box-shadow: inset -1px 0 var(--separator); position: relative; z-index: 5; }
  .tool-strip .btn { width: 36px; min-height: 34px; padding: 0; }
  .tool-strip .separator-h { width: 28px; margin: 4px 0; }
  .props { display: flex; flex-direction: column; }
  .props .scroll { padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; }
  .props .side-head { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .props .side-head .heading { font-weight: var(--fw-bold); flex: 1; }
  .props .foot { margin-top: auto; padding: 12px; display: flex; gap: 6px; box-shadow: inset 0 1px var(--separator); }
  .props .foot .btn { flex: 1; }
  .lbl { font-size: var(--fs-small); }
  .field-label { font-size: var(--fs-small); font-weight: var(--fw-bold); opacity: var(--dim-opacity); padding: 0 2px; }
  .row-stack { display: flex; flex-direction: column; gap: 6px; }
  .full { width: 100%; }
  .toggle-group.full { display: flex; }
  .toggle-group.full > .toggle { flex: 1; justify-content: center; padding: 0 4px; font-size: var(--fs-small); white-space: nowrap; }
  .toggle-group.full.four > .toggle { font-size: var(--fs-caption); padding: 0 2px; }
  .canvas-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  svg.annotations text { font-family: var(--font-ui); }
  .ants { fill: none; stroke: #ffffff; stroke-width: 1; }
  .ants2 { fill: none; stroke: #1f1f24; stroke-width: 1; stroke-dasharray: 4 4; }
  .hint { font-size: var(--fs-caption); opacity: var(--dim-opacity); padding: 0 2px; line-height: 1.4; }
  .scale .trough { flex: 1; }
  .scale .lbl { width: 84px; flex: none; }

  .stamp-grid { display: grid; grid-template-columns: repeat(5, 48px); gap: 6px; justify-content: space-between; }
  .stamp-cell { width: 48px; height: 48px; border-radius: var(--radius-s); display: grid; place-items: center; background: var(--fill-flat-hover); position: relative; }
  .stamp-cell svg { width: 36px; height: 36px; }
  .stamp-cell.selected { box-shadow: inset 0 0 0 2px var(--accent-bg); background: var(--accent-a12); }
  .stamp-cell.focus { outline: 2px solid var(--accent-a50); outline-offset: 1px; }
  .stamp-cell.add { background: transparent; box-shadow: inset 0 0 0 1px var(--borders); }
  .stamp-cell.add .icon { opacity: .7; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 28px; padding: 0 12px; border-radius: var(--radius-pill); background: var(--fill-1); display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-small); }
  .chip.active { background: var(--accent-bg); color: var(--accent-fg); }
  .chip .badge { height: 16px; min-width: 16px; font-size: 10px; }
  .edge-ico { width: 40px; height: 16px; display: block; }
  .lens { position: absolute; overflow: hidden; }
  .lens img { position: absolute; max-width: none; }
  .dim-layer { position: absolute; inset: 0; }
  .brush-cursor { position: absolute; border: 1.5px solid #1f1f24; box-shadow: 0 0 0 1px #fff; border-radius: 50%; }
  .measure { position: absolute; font-size: 11px; font-weight: 700; color: #fff; background: var(--accent-bg); padding: 2px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sel-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: var(--radius-s); background: var(--fill-1); font-size: var(--fs-small); }
  .sel-chip .dot { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 6 / 20%); }
</style>
</head>
<body class="mock-frame flush">

  </div>
