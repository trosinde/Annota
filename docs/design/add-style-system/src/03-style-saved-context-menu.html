<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport-size" content="1280x800">
<title>Annota — style saved</title>
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/adwaita.css">
<style>
  .tool-strip { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; background: var(--window-bg); box-shadow: inset -1px 0 var(--separator); position: relative; }
  .tool-strip .btn { width: 40px; min-height: 40px; }
  .tool-strip .separator-h { width: 28px; margin: 4px 0; }
  .props .scroll { padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; }
  .editor-col { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .editor-col > .split-view { flex: 1; }
  .content-pane { position: relative; }
  .tray { flex: none; height: 132px; background: var(--window-bg); box-shadow: inset 0 1px var(--separator); display: flex; flex-direction: column; }
  .tray-bar { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .tray-items { display: flex; gap: 12px; padding: 0 12px; }
  .tray-item { width: 120px; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .tray-item .thumb { width: 120px; height: 68px; border-radius: var(--radius-s); overflow: hidden; box-shadow: 0 0 0 1px var(--borders); background: var(--view-bg); }
  .tray-item .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .tray-item .name { font-size: var(--fs-caption); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .tray-item.open .thumb { box-shadow: 0 0 0 2px var(--borders-strong); }
  .tray-item.sel .thumb { box-shadow: 0 0 0 3px var(--accent-bg); }
  .tray-item .tick { position: absolute; top: 6px; right: 6px; }
  .tray-item .tick .check { box-shadow: inset 0 0 0 2px #fff, 0 1px 3px rgb(0 0 6 / 40%); background: rgb(0 0 6 / 25%); }
  .tray-item .tick .check.checked { background: var(--accent-bg); box-shadow: 0 0 0 2px #fff; }
  .kbd-row { display: inline-flex; gap: 4px; }
  .toast-overlay.over-canvas { left: 52px; right: 300px; }
  .toast-overlay.over-canvas.with-tray { bottom: 156px; }

  .qs-head { display: flex; align-items: center; gap: 6px; }
  .qs-head .heading { flex: 1; }
  .qs-head.theme-row { justify-content: space-between; margin-top: -6px; }
  .qs-head.theme-row .dropdown { min-height: 30px; }
  .qs-grid { display: grid; grid-template-columns: repeat(4, 63px); gap: 8px; }
  .qs { width: 63px; height: 48px; border-radius: var(--radius-m); background: var(--annota-paper); box-shadow: 0 0 0 1px var(--borders); position: relative; display: grid; place-items: center; }
  .qs svg.prev { width: 63px; height: 48px; }
  .qs.selected { box-shadow: 0 0 0 2px var(--accent-bg); }
  .qs.hover { box-shadow: 0 0 0 1px var(--borders-strong); background-image: linear-gradient(var(--row-hover), var(--row-hover)); }
  .qs.focus { outline: 2px solid var(--accent-a50); outline-offset: 2px; }
  .qs.new { box-shadow: 0 0 0 2px var(--accent-bg), 0 0 0 6px var(--accent-a25); }
  .qs .star { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; color: var(--annota-amber); }
  .qs .star .icon { width: 12px; height: 12px; filter: drop-shadow(0 0 1px rgb(0 0 0 / 40%)); }
  .qs.add { background: transparent; box-shadow: inset 0 0 0 1px var(--borders); color: var(--window-fg); opacity: .75; }
  .qs-label { font-size: var(--fs-caption-heading); font-weight: var(--fw-bold); opacity: var(--dim-opacity); margin: 4px 0 -6px; }
  .theme-chip { display: inline-flex; gap: 2px; }
  .theme-chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .save-btn { width: 100%; }
  .modified { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-small); }
  .modified .badge.dot { background: var(--accent-bg); }
  .fav-tool { display: flex; align-items: center; gap: 8px; font-size: var(--fs-caption-heading); font-weight: var(--fw-bold); opacity: var(--dim-opacity); margin-bottom: -6px; }
  .fav-tool .icon { width: 14px; height: 14px; }
  /* theme dialog */
  .theme-dlg { width: 900px; max-width: 900px; height: 700px; flex-direction: row; }
  .theme-dlg .tlist { width: 260px; flex: none; background: var(--sidebar-bg); display: flex; flex-direction: column; box-shadow: inset -1px 0 var(--sidebar-border); }
  .theme-dlg .tlist .headerbar { background: transparent; box-shadow: none; }
  .theme-dlg .tmain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .theme-dlg .tmain .headerbar { background: transparent; box-shadow: none; }
  .theme-dlg .tbody { flex: 1; padding: 6px 24px 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .theme-dlg .nav-row .theme-chip i { width: 8px; height: 16px; border-radius: 2px; }
  .theme-dlg .nav-row .icon.lock { opacity: var(--dim-opacity); }
  .pal { display: flex; gap: 10px; align-items: flex-start; }
  .pal .pc { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-family: var(--font-mono); opacity: .9; }
  .pal .swatch { width: 40px; height: 40px; border-radius: var(--radius-m); }
  .pal .swatch.add { background: transparent; box-shadow: inset 0 0 0 1px var(--borders-strong); display: grid; place-items: center; color: var(--window-fg); }
  .preview { border-radius: var(--radius-l); background: var(--view-bg); box-shadow: 0 0 0 1px var(--borders); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .preview .tiles { display: flex; gap: 8px; }
  .preview .fonts { display: flex; align-items: baseline; gap: 12px; padding-top: 10px; box-shadow: inset 0 1px var(--separator); }
  .preview .mini { flex: none; }
  .ro .pal .swatch { cursor: default; }
  .font-sample { font-size: 20px; font-weight: 700; }
</style>
</head>

svg></div><div class="qs "><svg class="prev" viewBox="0 0 63 48"><path d="M14 36 L46 14" stroke="var(--annota-ink)" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M35 13 L47 13 L45 25" stroke="var(--annota-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div><div class="qs "><svg class="prev" viewBox="0 0 63 48"><path d="M14 36 L46 14" stroke="var(--annota-coral)" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M35 13 L47 13 L45 25" stroke="var(--annota-coral)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div><div class="qs "><svg class="prev" viewBox="0 0 63 48"><path d="M14 36 L46 14" stroke="var(--annota-coral)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/><path d="M35 13 L47 13 L45 25" stroke="var(--annota-coral)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div><div class="qs "><svg class="prev" viewBox="0 0 63 48"><path d="M14 36 L46 14" stroke="rgb(0 0 0 / 25%)" stroke-width="5" stroke-linecap="round" transform="translate(1.5 2)"/><path d="M14 36 L46 14" stroke="var(--annota-coral)" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M35 13 L47 13 L45 25" stroke="var(--annota-coral)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div></div><div class="qs-label">My Styles</div><div class="qs-grid"><div class="qs "><svg class="prev" viewBox="0 0 63 48"><path d="M14 36 L46 14" stroke="#e4572e" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M35 13 L47 13 L45 25" stroke="#e4572e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span class="star"><svg class="icon"><use href="#i-star"/></svg></span></div><div class="qs "><svg class="prev" viewBox="0 0 63 48"><path d="M14 36 L46 14" stroke="var(--annota-ink)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" fill="none"/><path d="M35 13 L47 13 L45 25" stroke="var(--annota-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div><div class="qs new selected"><svg class="prev" viewBox="0 0 63 48"><path d="M14 36 L46 14" stroke="#14b8a6" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M35 13 L47 13 L45 25" stroke="#14b8a6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span class="star"><svg class="icon"><use href="#i-star"/></svg></span></div></div></div>
