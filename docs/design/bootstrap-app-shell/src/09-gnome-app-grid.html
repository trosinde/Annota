<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport-size" content="1280x800">
<title>Annota — app grid</title>
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/adwaita.css">
<style>
  .tool-strip { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; background: var(--window-bg); box-shadow: inset -1px 0 var(--separator); position: relative; }
  .tool-strip .btn { width: 40px; min-height: 40px; }
  .tool-strip .separator-h { width: 28px; margin: 4px 0; }
  .props .scroll { padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; }
  .editor-col { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .editor-col > .split-view { flex: 1; }
  .content-pane { position: relative; }
  .tray { flex: none; height: 132px; background: var(--window-bg); box-shadow: inset 0 1px var(--separator); display: flex; flex-direction: column; }
  .tray-bar { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .tray-items { display: flex; gap: 12px; padding: 0 12px; }
  .tray-item { width: 120px; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .tray-item .thumb { width: 120px; height: 68px; border-radius: var(--radius-s); overflow: hidden; box-shadow: 0 0 0 1px var(--borders); background: var(--view-bg); }
  .tray-item .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .tray-item .name { font-size: var(--fs-caption); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .tray-item.open .thumb { box-shadow: 0 0 0 2px var(--borders-strong); }
  .tray-item.sel .thumb { box-shadow: 0 0 0 3px var(--accent-bg); }
  .tray-item .tick { position: absolute; top: 6px; right: 6px; }
  .tray-item .tick .check { box-shadow: inset 0 0 0 2px #fff, 0 1px 3px rgb(0 0 6 / 40%); background: rgb(0 0 6 / 25%); }
  .tray-item .tick .check.checked { background: var(--accent-bg); box-shadow: 0 0 0 2px #fff; }
  .kbd-row { display: inline-flex; gap: 4px; }

  body { background: #1b1b1f; }
  .overview { width: 1280px; height: 800px; position: relative; background: radial-gradient(900px 500px at 50% 0%, #3a3d4a, #1b1b1f 70%); color: #fff; font-family: var(--font-ui); overflow: hidden; }
  .topbar { height: 30px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 14px; font-weight: 700; }
  .topbar .pill { width: 34px; height: 8px; border-radius: 4px; background: #fff; display: inline-block; }
  .topbar .dot { width: 6px; height: 6px; border-radius: 3px; background: rgb(255 255 255 / 50%); display: inline-block; margin-left: 4px; }
  .ov-search { width: 320px; height: 36px; margin: 22px auto 0; border-radius: 18px; background: rgb(255 255 255 / 12%); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 15px; }
  .ov-search .ph { opacity: .55; }
  .grid { display: grid; grid-template-columns: repeat(6, 132px); gap: 46px 36px; justify-content: center; margin-top: 52px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 14px; padding: 12px 0; border-radius: 18px; }
  .app.hl { background: rgb(255 255 255 / 12%); }
  .app .ai { width: 84px; height: 84px; border-radius: 18px; display: grid; place-items: center; color: #fff; box-shadow: 0 3px 0 rgb(0 0 0 / 25%), 0 6px 14px rgb(0 0 0 / 30%); }
  .app .ai .icon { width: 40px; height: 40px; }
  .app img { width: 92px; height: 92px; margin: -4px; }
  .dash { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 10px; padding: 10px; border-radius: 22px; background: rgb(255 255 255 / 12%); }
  .dash .ai { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; }
  .dash .ai .icon { width: 26px; height: 26px; color: #fff; }
  .dash img { width: 56px; height: 56px; margin: -2px; }
  .page-dots { position: absolute; bottom: 104px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .page-dots span { width: 8px; height: 8px; border-radius: 4px; background: rgb(255 255 255 / 30%); }
  .page-dots span:first-child { background: #fff; }
  .results { width: 760px; margin: 28px auto 0; border-radius: 18px; background: rgb(255 255 255 / 10%); padding: 18px; display: flex; gap: 18px; }
  .results .app { width: 132px; }
  .tip { position: absolute; background: rgb(0 0 0 / 80%); padding: 6px 12px; border-radius: 8px; font-size: 13px; }
</style>
</head>
<body class="">
<div class="overview"><div class="topbar"><span><span class="pill"></span><span class="dot"></span><span class="dot"></span></span><span>Fri 30 Oct  14:22</span><span>⏻</span></div>
<div class="ov-search"><svg class="icon"><use href="#i-search"/></svg><span class="ph">Type to search</span></div>
<div class="grid"><div class="app"><div class="ai" style="background:#3a7bd5"><svg class="icon"><use href="#i-folder"/></svg></div><span>Files</span></div><div class="app"><div class="ai" style="background:#58a55c"><svg class="icon"><use href="#i-text"/></svg></div><span>Text Editor</span></div><div class="app hl"><img src="../../kit/app-icon/annota.svg" alt=""><span>Annota</span></div><div class="app"><div class="ai" style="background:#3d3d44"><svg class="icon"><use href="#i-keyboard"/></svg></div><span>Terminal</span></div><div class="app"><div class="ai" style="background:#6a6f7c"><svg class="icon"><use href="#i-settings"/></svg></div><span>Settings</span></div><div class="app"><div class="ai" style="background:#d9822b"><svg class="icon"><use href="#i-image"/></svg></div><span>Image Viewer</span></div><div class="app"><div class="ai" style="background:#c64545"><svg class="icon"><use href="#i-timer"/></svg></div><span>Calendar</span></div><div class="app"><div class="ai" style="background:#2f6fa6"><svg class="icon"><use href="#i-play"/></svg></div><span>Videos</span></div><div class="app"><div class="ai" style="background:#b5367a"><svg class="icon"><use href="#i-microphone"/></svg></div><span>Sound Recorder</span></div><div class="app"><div class="ai" style="background:#4c8f8a"><svg class="icon"><use href="#i-info"/></svg></div><span>Help</span></div><div class="app"><div class="ai" style="background:#8a6d3b"><svg class="icon"><use href="#i-folder"/></svg></div><span>Archive Manager</span></div><div class="app"><div class="ai" style="background:#6b4fa3"><svg class="icon"><use href="#i-grid-view"/></svg></div><span>Disk Usage</span></div></div>
<div class="tip" style="left:465px;top:286px">Capture and annotate screenshots</div>
<div class="page-dots"><span></span><span></span></div>
<div class="dash"><div class="ai" style="background:#3a7bd5"><svg class="icon"><use href="#i-folder"/></svg></div><div class="ai" style="background:#58a55c"><svg class="icon"><use href="#i-text"/></svg></div><img src="../../kit/app-icon/annota.svg" alt=""><div class="ai" style="background:#6a6f7c"><svg class="icon"><use href="#i-settings"/></svg></div><div class="ai" style="background:#3d3d44"><svg class="icon"><use href="#i-grid-view"/></svg></div></div>
</div>
<script src="../../kit/icons.js"></script>
</body>
</html>
